[project]
name = "ableton-fcb1010-controller"
version = "0.1.0"
description = "Ableton Live 12 MIDI Remote Script for a stock Behringer FCB1010"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[dependency-groups]
dev = [
    "ableton-live-stubs>=12.3",
    "mido>=1.3",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "python-rtmidi>=1.5",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Live ships only as stubs (ableton-live-stubs); the real module exists inside Live.
reportMissingModuleSource = false
include = ["FCB1010", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
